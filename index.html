<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAITRIX Firmware Update</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #141414; color: #fff;
         font-family: "Barlow", "Noto Sans TC", system-ui, sans-serif; }
  .strip { height: 4px; background: #00AAFF; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  .card { max-width: 560px; width: 100%; background: #242424; border: 1px solid rgba(255,255,255,.12); padding: 40px 32px;
          clip-path: polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px); }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .18em; color: #33BBFF; text-transform: uppercase; }
  h1 { margin: 12px 0 8px; font-size: 32px; line-height: 1.15; }
  p { margin: 0 0 6px; color: #BFBEBC; font-size: 17px; line-height: 1.5; }
  footer { background: #000; color: #949392; font-size: 14px; padding: 20px 16px; text-align: center; }
</style>
</head>
<body>
<div class="strip"></div>
<main>
  <div class="card">
    <div class="eyebrow">VAITRIX Firmware Update</div>
    <h1>固件更新頁面準備中</h1>
    <p>線上更新服務即將開放，請稍後再回來。</p>
    <p lang="en">The online firmware update page is coming soon.</p>
  </div>
</main>
<footer>© VAITRIX</footer>
</body>
</html>
